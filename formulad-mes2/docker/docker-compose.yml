# FormulaD MES 2.0 — тестовая среда.
# docker compose -f docker/docker-compose.yml up -d
# Первый запуск: ~30 с на создание БД и заливку тестовых данных.
#
# Подключение для приложения:
#   Sql__ConnectionString="Server=localhost,1433;Database=FormulaD_TEST;User ID=mes_writer;Password=MesWriter2024!;TrustServerCertificate=True"
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: formulad-test-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "FormulaD_Test2024!"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "FormulaD_Test2024!" -C -Q "SELECT 1" -b
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Одноразовый init-контейнер: ждёт SQL Server и заливает схему + данные.
  init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: formulad-test-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./init:/docker-entrypoint-initdb.d
    entrypoint: /bin/bash
    command: /docker-entrypoint-initdb.d/setup.sh
    environment:
      MSSQL_SA_PASSWORD: "FormulaD_Test2024!"
      MSSQL_HOST: sqlserver

  mes-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: formulad-mes-api
    depends_on:
      sqlserver:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    ports:
      - "5080:5080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Sql__ConnectionString: "Server=sqlserver;Database=FormulaD_TEST;User ID=mes_reader;Password=MesReader2024!;TrustServerCertificate=True"
      Sql__WriteConnectionString: "Server=sqlserver;Database=FormulaD_TEST;User ID=mes_writer;Password=MesWriter2024!;TrustServerCertificate=True"
      DevAuth__Enabled: "true"
      DevAuth__Username: "admin"
      DevAuth__Password: "F7mes"

volumes:
  sqldata:
