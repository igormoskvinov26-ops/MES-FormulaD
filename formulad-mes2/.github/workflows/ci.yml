name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build FormulaD.Mes.slnx -c Release --nologo
      - name: Тесты и покрытие
        run: dotnet test FormulaD.Mes.slnx -c Release --no-build --nologo --collect:"XPlat Code Coverage" --results-directory "$RUNNER_TEMP/cov"
      - name: Порог покрытия бэкенда
        run: python3 scripts/check-backend-coverage.py "$RUNNER_TEMP/cov" 50

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit -p .
      - name: Тесты и покрытие (пороги в vite.config.ts)
        run: npx vitest run --coverage
      - run: npx vite build --outDir "$RUNNER_TEMP/web-dist"

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Пароль стенда (одноразовый, в логах маскируется)
        run: |
          pw="$(openssl rand -hex 12)"
          echo "::add-mask::$pw"
          echo "STAND_PASSWORD=$pw" >> "$GITHUB_ENV"
      - name: Стенд (режим Demo)
        run: ./stand/stand.sh up
      - name: Playwright
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium
      - name: Сквозные тесты
        working-directory: tests/e2e
        env:
          E2E_PASSWORD: ${{ env.STAND_PASSWORD }}
        run: npx playwright test
      - name: Отчёт и трейсы при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7
      - name: Остановка стенда
        if: always()
        run: ./stand/stand.sh down || true

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Секреты в добавленных строках
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scripts/check-secrets.sh "origin/${{ github.base_ref }}"
          elif echo "${{ github.event.before }}" | grep -qE '^0+$'; then
            echo "Первый пуш в ветку: сравнивать не с чем, проверка пропущена"
          else
            scripts/check-secrets.sh "${{ github.event.before }}"
          fi

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-doc-links.py
