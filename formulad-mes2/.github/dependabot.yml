version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    open-pull-requests-limit: 0  # версии отключены решением владельца
    labels: [dependencies]
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 0  # версии отключены решением владельца
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    labels: [dependencies]
    # Обновления Actions отключены решением владельца; уязвимости Dependabot по-прежнему сообщает отдельно.
    ignore:
      - dependency-name: "*"
