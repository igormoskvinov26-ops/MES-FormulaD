<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rubl Telegram Admin — Настройки</title>
<style>
  :root {
    --bg:#0d0b0a; --panel:#161311; --panel2:#1e1a17; --line:#2c2621;
    --text:#f2ece1; --muted:#9c8f7d; --accent:#e8c37a; --ok:#4caf7d; --err:#d66; --warn:#d8a24a; --radius:12px;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; font-size:15px; }
  header { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  h1 { font-size:18px; margin:0; letter-spacing:1px; }
  a.nav { color:var(--muted); text-decoration:none; border:1px solid var(--line); padding:6px 12px; border-radius:8px; }
  a.nav:hover { border-color:var(--accent); color:var(--text); }
  main { max-width:820px; margin:0 auto; padding:20px; display:grid; gap:18px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px; }
  .card h2 { font-size:14px; text-transform:uppercase; letter-spacing:1px; margin:0 0 14px; color:var(--muted); }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  input, select { width:100%; background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:9px 11px; font-size:14px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .row > * { flex:1; min-width:120px; }
  .hint { font-size:12px; color:var(--muted); margin-top:3px; }
  .saved { color:var(--ok); }
  button { background:var(--panel2); color:var(--text); border:1px solid var(--line); padding:9px 14px; border-radius:8px; cursor:pointer; font-size:13px; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#1a1206; border-color:var(--accent); font-weight:700; }
  .btns { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  .barber { border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; background:var(--panel2); }
  .barber .row { align-items:center; }
  .chk { display:flex; align-items:center; gap:8px; }
  .chk input { width:auto; }
  pre { background:#0a0807; border:1px solid var(--line); border-radius:8px; padding:12px; overflow:auto; white-space:pre-wrap; font-size:13px; max-height:260px; }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#23201c; border:1px solid var(--line); padding:10px 16px; border-radius:10px; display:none; }
  .mode { padding:3px 9px; border-radius:999px; font-size:12px; font-weight:700; }
  .mode.test { background:#33240f; color:var(--accent); border:1px solid #5a441c; }
  .mode.prod { background:#3a1414; color:#f4a; border:1px solid #6a2020; }
</style>
</head>
<body>
<header>
  <h1>НАСТРОЙКИ</h1>
  <span id="modeBadge" class="mode test">TEST</span>
  <span style="margin-left:auto" class="row" >
    <a class="nav" href="/">← Панель</a>
    <input id="token" type="password" placeholder="admin token (если задан)" style="width:180px" />
  </span>
</header>

<main>
  <!-- YCLIENTS -->
  <section class="card">
    <h2>YCLIENTS</h2>
    <label>Partner token (Bearer)</label>
    <input id="y_partner" type="password" placeholder="вставь партнёрский токен" />
    <div class="hint" id="y_partner_hint"></div>

    <label>API base</label>
    <input id="y_apibase" type="text" />

    <div class="btns"><button onclick="saveYclientsTokens()">Сохранить токены</button></div>

    <hr style="border-color:var(--line); margin:18px 0" />
    <h2>Мастер подключения</h2>
    <div class="row">
      <div><label>Логин менеджера</label><input id="y_login" type="text" placeholder="телефон/почта" /></div>
      <div><label>Пароль</label><input id="y_password" type="password" /></div>
      <div style="flex:0 0 auto"><button class="primary" onclick="yAuth()">Войти → получить user token</button></div>
    </div>
    <div class="hint" id="y_user_hint"></div>

    <div class="btns">
      <button onclick="loadCompanies()">Загрузить компании</button>
    </div>
    <label>Компания (company_id)</label>
    <select id="y_company"><option value="">—</option></select>

    <div class="btns">
      <button onclick="loadStaff()">Загрузить мастеров</button>
      <button class="primary" onclick="saveYclientsCompany()">Сохранить компанию</button>
    </div>
  </section>

  <!-- Barbers mapping -->
  <section class="card">
    <h2>Мастера → staff id</h2>
    <div id="barbers"></div>
    <div class="btns"><button class="primary" onclick="saveBarbers()">Сохранить мастеров</button></div>
    <div class="hint">Список staff id подгружается кнопкой «Загрузить мастеров» выше. Можно и вписать id вручную.</div>
  </section>

  <!-- Telegram -->
  <section class="card">
    <h2>Telegram</h2>
    <label>Bot token</label>
    <input id="t_bot" type="password" placeholder="123456:AA..." />
    <div class="hint" id="t_bot_hint"></div>
    <div class="btns"><button onclick="saveBotToken()">Сохранить токен</button><button onclick="checkBot()">Проверить бота</button></div>

    <div class="row">
      <div>
        <label>Test chat id</label>
        <input id="t_test" type="text" placeholder="-100..." />
      </div>
      <div style="flex:0 0 auto"><button onclick="detectChat()">Определить из чата</button></div>
    </div>
    <select id="t_detected" style="display:none; margin-top:8px"></select>

    <label>Production chat id</label>
    <input id="t_prod" type="text" placeholder="-100... (используется только в production-режиме)" />

    <label>Business connection id (для нативных Story)</label>
    <input id="t_business" type="text" placeholder="необязательно" />

    <div class="row" style="margin-top:12px">
      <div>
        <label>Режим</label>
        <select id="t_mode"><option value="test">test</option><option value="production">production</option></select>
      </div>
      <div class="chk" style="flex:0 0 auto; margin-top:22px"><input id="t_dry" type="checkbox" /><label style="margin:0">Dry-run (не отправлять)</label></div>
    </div>
    <div class="btns"><button class="primary" onclick="saveTelegram()">Сохранить Telegram</button></div>
  </section>

  <!-- General -->
  <section class="card">
    <h2>Общее</h2>
    <label>Booking URL</label>
    <input id="g_booking" type="text" />
    <div class="row" style="margin-top:6px">
      <div><label>Утро</label><input id="g_morning" type="time" /></div>
      <div><label>День</label><input id="g_day" type="time" /></div>
      <div><label>Вечер</label><input id="g_evening" type="time" /></div>
      <div><label>Отчёт</label><input id="g_report" type="time" /></div>
    </div>
    <div class="btns"><button class="primary" onclick="saveGeneral()">Сохранить общее</button></div>
    <div class="hint">Время по Europe/Moscow. Изменение расписания перезапускает scheduler.</div>
  </section>

  <!-- Test connections -->
  <section class="card">
    <h2>Проверка подключений</h2>
    <div class="btns"><button onclick="runTest()">Проверить всё</button></div>
    <pre id="testOut" style="display:none"></pre>
  </section>
</main>

<div id="toast" class="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
$('token').value = localStorage.getItem('adminToken') || '';
$('token').oninput = () => localStorage.setItem('adminToken', $('token').value);
function headers(){ const t=$('token').value.trim(); return t?{'x-admin-token':t,'Content-Type':'application/json'}:{'Content-Type':'application/json'}; }
async function api(path, opts={}){ const r=await fetch('/api/admin'+path,{headers:headers(),...opts}); const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||('HTTP '+r.status)); return j; }
function toast(m){ const t=$('toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',3200); }

let S = null;
async function loadSettings(){
  const { settings } = await api('/settings');
  S = settings;
  // yclients
  $('y_partner_hint').innerHTML = settings.yclients.partnerTokenSet ? '<span class="saved">✓ сохранён</span> — оставь пустым, чтобы не менять' : 'не задан';
  $('y_apibase').value = settings.yclients.apiBase;
  $('y_user_hint').innerHTML = settings.yclients.userTokenSet ? '<span class="saved">✓ user token получен</span>' : 'user token ещё не получен — войди логином/паролем';
  if (settings.yclients.companyId) { setOption($('y_company'), settings.yclients.companyId, 'company '+settings.yclients.companyId); }
  // telegram
  $('t_bot_hint').innerHTML = settings.telegram.botTokenSet ? '<span class="saved">✓ сохранён '+(settings.telegram.botTokenHint||'')+'</span>' : 'не задан';
  $('t_test').value = settings.telegram.testChatId||'';
  $('t_prod').value = settings.telegram.productionChatId||'';
  $('t_business').value = settings.telegram.businessConnectionId||'';
  $('t_mode').value = settings.telegram.mode;
  $('t_dry').checked = settings.telegram.dryRun;
  $('modeBadge').textContent = settings.telegram.mode.toUpperCase();
  $('modeBadge').className = 'mode '+(settings.telegram.mode==='test'?'test':'prod');
  // general
  $('g_booking').value = settings.bookingUrl;
  $('g_morning').value = settings.schedule.morning;
  $('g_day').value = settings.schedule.day;
  $('g_evening').value = settings.schedule.evening;
  $('g_report').value = settings.schedule.dailyReport;
  renderBarbers();
}
function setOption(sel, val, label){ let o=[...sel.options].find(x=>x.value==val); if(!o){o=document.createElement('option');o.value=val;o.textContent=label;sel.appendChild(o);} sel.value=val; }

function renderBarbers(){
  $('barbers').innerHTML = S.barbers.map(b => `
    <div class="barber">
      <div class="row">
        <div style="flex:0 0 120px"><b>${b.displayName}</b><div class="hint">${b.slug}</div></div>
        <div><label>staff id</label>
          <select data-staff="${b.slug}"><option value="${b.staffId||''}">${b.staffId||'—'}</option></select>
        </div>
        <div style="flex:0 0 auto" class="chk"><input type="checkbox" data-enabled="${b.slug}" ${b.enabled?'checked':''}/><label style="margin:0">включён</label></div>
      </div>
    </div>`).join('');
}

// ---- YCLIENTS ----
async function saveYclientsTokens(){
  try{
    await api('/settings',{method:'POST',body:JSON.stringify({ yclients:{ partnerToken:$('y_partner').value.trim(), apiBase:$('y_apibase').value.trim() } })});
    $('y_partner').value=''; toast('Токены YCLIENTS сохранены'); loadSettings();
  }catch(e){ toast('Ошибка: '+e.message); }
}
async function yAuth(){
  try{
    const r = await api('/settings/yclients/auth',{method:'POST',body:JSON.stringify({ login:$('y_login').value.trim(), password:$('y_password').value })});
    $('y_password').value=''; toast('User token получен'+(r.name?(' · '+r.name):'')); loadSettings();
  }catch(e){ toast('Ошибка авторизации: '+e.message); }
}
async function loadCompanies(){
  try{
    const { companies } = await api('/settings/yclients/companies');
    const sel=$('y_company'); sel.innerHTML='<option value="">—</option>';
    companies.forEach(c=>{ const o=document.createElement('option'); o.value=c.id; o.textContent=c.title+' ('+c.id+')'; sel.appendChild(o); });
    if(S.yclients.companyId) sel.value=S.yclients.companyId;
    toast(companies.length+' компаний загружено');
  }catch(e){ toast('Ошибка: '+e.message); }
}
async function saveYclientsCompany(){
  try{
    await api('/settings',{method:'POST',body:JSON.stringify({ yclients:{ companyId:String($('y_company').value) } })});
    toast('Компания сохранена'); loadSettings();
  }catch(e){ toast('Ошибка: '+e.message); }
}
async function loadStaff(){
  try{
    const cid = $('y_company').value || S.yclients.companyId;
    const { staff } = await api('/settings/yclients/staff'+(cid?('?companyId='+encodeURIComponent(cid)):''));
    document.querySelectorAll('select[data-staff]').forEach(sel=>{
      const cur=sel.value; sel.innerHTML='<option value="">—</option>';
      staff.forEach(s=>{ const o=document.createElement('option'); o.value=s.id; o.textContent=s.name+' ('+s.id+')'+(s.fired?' [уволен]':''); sel.appendChild(o); });
      if(cur) setOption(sel,cur,cur);
    });
    toast(staff.length+' мастеров загружено — выбери и сохрани');
  }catch(e){ toast('Ошибка: '+e.message); }
}
async function saveBarbers(){
  try{
    const barbers = S.barbers.map(b=>{
      const sel=document.querySelector('select[data-staff="'+b.slug+'"]');
      const chk=document.querySelector('input[data-enabled="'+b.slug+'"]');
      return { slug:b.slug, displayName:b.displayName, template:b.template, staffId:Number(sel.value||0), enabled:chk.checked };
    });
    await api('/settings',{method:'POST',body:JSON.stringify({ barbers })});
    toast('Мастера сохранены'); loadSettings();
  }catch(e){ toast('Ошибка: '+e.message); }
}

// ---- Telegram ----
async function saveBotToken(){
  try{ await api('/settings',{method:'POST',body:JSON.stringify({ telegram:{ botToken:$('t_bot').value.trim() } })}); $('t_bot').value=''; toast('Bot token сохранён'); loadSettings(); }
  catch(e){ toast('Ошибка: '+e.message); }
}
async function checkBot(){
  try{ const r=await api('/settings/test',{method:'POST',body:'{}'}); const t=r.telegram; toast(t.ok?('Бот OK: @'+t.username+(t.canConnectToBusiness?' · business✓':' · business✗')):('Ошибка: '+t.error)); }
  catch(e){ toast('Ошибка: '+e.message); }
}
async function detectChat(){
  try{
    const { chats } = await api('/settings/telegram/detect-chat',{method:'POST',body:'{}'});
    if(!chats.length){ toast('Чаты не найдены — добавь бота в группу и напиши там сообщение'); return; }
    const sel=$('t_detected'); sel.style.display='block'; sel.innerHTML='';
    chats.forEach(c=>{ const o=document.createElement('option'); o.value=c.id; o.textContent=c.title+' ('+c.type+', '+c.id+')'; sel.appendChild(o); });
    $('t_test').value=chats[0].id; sel.onchange=()=>{ $('t_test').value=sel.value; };
    toast(chats.length+' чат(ов) найдено');
  }catch(e){ toast('Ошибка: '+e.message); }
}
async function saveTelegram(){
  try{
    await api('/settings',{method:'POST',body:JSON.stringify({ telegram:{
      testChatId:$('t_test').value.trim(), productionChatId:$('t_prod').value.trim(),
      businessConnectionId:$('t_business').value.trim(), mode:$('t_mode').value, dryRun:$('t_dry').checked,
    }})});
    toast('Telegram сохранён'); loadSettings();
  }catch(e){ toast('Ошибка: '+e.message); }
}

// ---- General ----
async function saveGeneral(){
  try{
    await api('/settings',{method:'POST',body:JSON.stringify({
      bookingUrl:$('g_booking').value.trim(),
      schedule:{ morning:$('g_morning').value, day:$('g_day').value, evening:$('g_evening').value, dailyReport:$('g_report').value },
    })});
    toast('Общие настройки сохранены'); loadSettings();
  }catch(e){ toast('Ошибка: '+e.message); }
}

async function runTest(){
  try{ const r=await api('/settings/test',{method:'POST',body:'{}'}); $('testOut').style.display='block'; $('testOut').textContent=JSON.stringify(r,null,2); }
  catch(e){ $('testOut').style.display='block'; $('testOut').textContent='Ошибка: '+e.message; }
}

loadSettings().catch(e=>toast('Не удалось загрузить настройки: '+e.message));
</script>
</body>
</html>
